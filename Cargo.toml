[workspace]
members = ["watchdog"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
version = "0.1.1"

[package]
name = "mtp-splitter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows 애플리케이션별 터널링 구성 요소와 프로토콜 검증 도구"

[dependencies]
aes = "0.8.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctr = "0.9.2"
dashmap = "6.1"
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
hmac = "0.12.1"
lru = "0.16"
memmap2 = "0.9"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
subtle = "2.6"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
zeroize = { version = "1.8", features = ["derive"] }
x25519-dalek = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
socket2 = "0.6"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
eframe = { version = "0.33.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "dx12", "wgsl"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Services", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_LibraryLoader", "Win32_NetworkManagement_IpHelper", "Win32_System_Performance", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "mtp-splitter"
path = "src/main.rs"
